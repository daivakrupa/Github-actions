
name: Manual Deploy to Dev ECS

on:
  workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: 90234567890
  REPO_NAME: dev-backend
  ECS_CLUSTER_NAME: dev
  ECS_SERVICE_NAME: Ecs-dev-Service
  TAG_PREFIX: dev
  TASK_DEFINITION_FAMILY: .github/workflows/dev-task-definition.json
  CONTAINER_NAME: backend-dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          ref: develop
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEYID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check if ECR repository exists
        id: ecr-check
        run: |
          aws ecr describe-repositories --repository-names $REPO_NAME || echo "::set-output name=repo-exists::false"
          echo "::set-output name=repo-name::$REPO_NAME"

      - name: Create ECR repository if it does not exist
        id: ecr-create
        if: steps.ecr-check.outputs.repo-exists != 'true'
        run: |
          aws ecr create-repository --repository-name $REPO_NAME || echo "::error ::Failed to create ECR repository"
          echo "::set-output name=repo-name::$REPO_NAME"

      - name: Output ECR repository name
        run: |
          echo "ECR Repository Name: ${{ steps.ecr-create.outputs.repo-name }}"

      - name: Get ECR Repository URL
        id: ecr-repo-url
        run: |
          REPO_URI=$(aws ecr describe-repositories --repository-names $REPO_NAME --query "repositories[0].repositoryUri" --output text)
          echo "::set-output name=repo-url::$REPO_URI"

      - name: Login to Amazon ECR
        id: ecr-login
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin ${{ steps.ecr-repo-url.outputs.repo-url }}

      - name: Get the latest image tag
        id: get-latest-tag
        run: |
          latest_tag=$(aws ecr describe-images --repository-name $REPO_NAME --query 'sort_by(imageDetails,& imagePushedAt)[-1].imageTags' --output text)
          echo "::set-output name=tag::$latest_tag"

      - name: Increment image tag
        id: increment-tag
        run: |
          latest_tag=${{ steps.get-latest-tag.outputs.tag }}
          tag_number=${latest_tag#dev}
          next_tag_number=$((tag_number + 1))
          next_tag=dev$next_tag_number
          echo "::set-output name=tag::$next_tag"

      - name: Build and tag Docker image
        run: |
          next_tag=${{ steps.increment-tag.outputs.tag }}
          docker build -t ${{ steps.ecr-create.outputs.repo-name }} .
          docker tag ${{ steps.ecr-create.outputs.repo-name }}:latest ${{ steps.ecr-repo-url.outputs.repo-url }}:$next_tag

      - name: Push Docker image to ECR
        run: |
          next_tag=${{ steps.increment-tag.outputs.tag }}
          docker push ${{ steps.ecr-repo-url.outputs.repo-url }}:$next_tag

      - name: Debug image tag and URI
        run: |
          echo "ECR Repository URI: ${{ steps.ecr-repo-url.outputs.repo-url }}"
          echo "Next Image Tag: ${{ steps.increment-tag.outputs.tag }}"

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.TASK_DEFINITION_FAMILY }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.ecr-repo-url.outputs.repo-url }}:${{ steps.increment-tag.outputs.tag }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_NAME }}
          cluster: ${{ env.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true
          
      - name: Get commit details
        id: commit_details
        run: |
          COMMIT_ID=$(git rev-parse HEAD)
          COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          BUILD_USER=$(git log -1 --pretty=%an)
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
          COMMIT_AUTHOR=$(git log -1 --pretty=%an)
          echo "::set-output name=commit_id::$COMMIT_ID"
          echo "::set-output name=commit_message::$COMMIT_MESSAGE"
          echo "::set-output name=build_user::$BUILD_USER"
          echo "::set-output name=changed_files::$CHANGED_FILES"
          echo "::set-output name=commit_author::$COMMIT_AUTHOR"

      - name: Send Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.office365.com
          server_port: 587
          secure: false
          from: no-reply@gmail.com
          to: daivakrupat@eficens.com,sdfghu@gmail.com
          username: no-reply@gmail.com
          password: ${{ secrets.SMTP_PASSWORD }}
          ignore_cert: true
          subject: VisiQ Backend Deployment Succeeded
          body: Deployment is Succeeded
          html_body: |
            <p>
            The Backend deployment of VisiQ in Dev environment is successfully completed. <br>
            <p><b>Commit Message:</b> ${{ steps.commit_details.outputs.commit_message }}</p>
                <p><b>Commit ID:</b> ${{ steps.commit_details.outputs.commit_id }}</p>
                <p><b>Build User:</b> ${{ steps.commit_details.outputs.build_user }}</p>
                <p><b>Commit Author:</b> ${{ steps.commit_details.outputs.commit_author }}</p>
                <p><b>Branch:</b> ${{ github.ref }}</p>
                <p><b>Changed Files:</b></p>
                <pre>${{ steps.commit_details.outputs.changed_files }}</pre>
            </p>
